<script>
(function(){
  const BUILD='19.4.8.20260919-STATEMENT-REBUILT-1';
  const KEY='hane_app_shell_build';
  try {
    if (localStorage.getItem(KEY) !== BUILD) {
      localStorage.setItem(KEY, BUILD);
      if ('caches' in window) caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('hane-')).map(k=>caches.delete(k)))).catch(()=>{});
      if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(regs=>Promise.all(regs.map(r=>r.update().catch(()=>{})))).catch(()=>{});
    }
  } catch(e) {}
})();
</script>

<body>
<div id="app"></div>
<input id="profileInput" type="file" accept="image/*" hidden>
<input id="receiptInput" type="file" accept="image/*" capture="environment" hidden>
<input id="restoreInput" type="file" hidden>
<input id="statementImportInput" type="file" accept="image/*,application/pdf,.pdf" hidden>
<script defer src="./app-v19.js?v=19.4.8.20260919-STATEMENT-REBUILT-1"></script>

<script>
(function(){
  const BUILD = '19.4.8.20260919-STATEMENT-REBUILT-1';
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js?v=' + BUILD, {updateViaCache:'none'});
      await reg.update();
      reg.addEventListener('updatefound', () => {
        const worker = reg.installing;
        if (!worker) return;
        worker.addEventListener('statechange', () => {
          if (worker.state === 'installed' && navigator.serviceWorker.controller) worker.postMessage({type:'SKIP_WAITING'});
        });
      });
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });
    } catch (e) { console.warn('HANE update worker:', e); }
  });
})();
</script>
