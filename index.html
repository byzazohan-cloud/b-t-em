<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05080d" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'; media-src 'none'" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bütçem" />
  <title>Bütçem</title>
  <link rel="manifest" href="manifest.json?v=6" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="styles-v9.css" />
</head>
<body>
  <div id="app">
    <main class="phone">
      <div class="login">
        <div class="lock">♙</div>
        <div class="brand">Bütçem</div>
        <div class="subtitle">Verileriniz cihazınızda şifreli saklanır.</div>
        <div class="avatar">M</div>
        <h2>Mehmet</h2>
        <form id="fallbackLogin" class="login-form">
          <input type="password" inputmode="numeric" placeholder="Parola" autocomplete="current-password" disabled />
          <button type="button" class="primary" disabled>Uygulama yükleniyor…</button>
        </form>
        <div class="security-note" style="margin-top:16px">Bu ekran 10 saniyeden uzun kalırsa yeni sürüm yüklenmemiş demektir.</div>
      </div>
    </main>
  </div>
  <input id="fileRestore" type="file" accept=".butcem,application/json" hidden>
  <script src="app-v9.js" defer></script>
</body>
</html>
